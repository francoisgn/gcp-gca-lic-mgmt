name: Release

# A version tag (v1.2.3, v0.1.0-alpha.1) publishes a GitHub release whose
# notes are the matching section of CHANGELOG.md — a pre-release when the
# version has a suffix. The container image of the tag is published by CI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/changelog-section.sh "$version" > notes.md
          {
            echo
            echo "**Container image**: \`ghcr.io/${GITHUB_REPOSITORY,,}:${version}\`"
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
