# =============================================================================
# GitLab CI/CD — same checks as .github/workflows/ci.yml, plus the delivery to
# Google Cloud with Workload Identity Federation (no service account key).
#
#   lint ──┬─ lint:go         gofmt · go vet · staticcheck · govulncheck
#          ├─ lint:terraform  fmt · init · validate
#          └─ lint:secrets    gitleaks on the history
#   test ──── test            unit + integration on PostgreSQL 16, -race, coverage
#   build ─── build:image     image → Artifact Registry       (default branch, v* tags)
#   deploy ── deploy          rollout: Cloud Run service + jobs (v* tags; manual on the default branch)
#
# One-off set-up (see the "Continuous Integration" wiki page):
#   1. terraform apply with gitlab_project_path / gitlab_url (deploy/terraform/cicd.tf);
#   2. Settings → CI/CD → Variables: the 4 values of `terraform output gitlab_ci_variables`
#      (GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA) — none is secret;
#   3. protect the default branch and the v* tags: Google only trusts tokens of protected refs.
# =============================================================================

stages: [lint, test, build, deploy]

variables:
  # Images — point them to your internal mirror if the runners have no Internet access.
  GO_IMAGE: golang:1.26
  POSTGRES_IMAGE: postgres:16-alpine
  TERRAFORM_IMAGE: hashicorp/terraform:1.9.8
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  DOCKER_IMAGE: docker:27.5
  GCLOUD_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
  IMAGE_NAME: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/gcalm/gcalm

workflow:
  rules:
    # Merge request pipelines; branch pipelines only when no merge request is open (no duplicates).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

default:
  interruptible: true # a newer pipeline on the same ref cancels this one

# --- Checks ------------------------------------------------------------------

.go:
  image: $GO_IMAGE
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOTOOLCHAIN: local
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod/, .cache/go-build/]

lint:go:
  extends: .go
  stage: lint
  script:
    - unformatted=$(gofmt -l $(git ls-files '*.go'))
    - if [ -n "$unformatted" ]; then echo "gofmt needed on:" $unformatted; exit 1; fi
    - go vet ./...
    - go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
    - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

lint:terraform:
  stage: lint
  image:
    name: $TERRAFORM_IMAGE
    entrypoint: [""]
  script:
    - cd deploy/terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate

lint:secrets:
  stage: lint
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0 # whole history
  script:
    - gitleaks git --no-banner --redact --verbose .

test:
  extends: .go
  stage: test
  needs: []
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_USER: gcalm
    POSTGRES_PASSWORD: gcalm
    POSTGRES_DB: gcalm_test
    TEST_DATABASE_URL: postgres://gcalm:gcalm@postgres:5432/gcalm_test?sslmode=disable
  script:
    # -p 1: integration tests share one database.
    - go test -race -p 1 -count=1 -covermode=atomic -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -n 1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 7 days
    paths: [coverage.out]

# --- Delivery (keyless) ------------------------------------------------------

# The job receives a GitLab OIDC token for Google; scripts/ci/gcp-token.sh
# exchanges it for a short-lived token of the deployer service account.
.gcp:
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/${GCP_WIF_PROVIDER}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:image:
  extends: .gcp
  stage: build
  needs: [lint:go, lint:secrets, test]
  image: $DOCKER_IMAGE
  services:
    - name: ${DOCKER_IMAGE}-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
  script:
    - apk add --no-cache curl
    - scripts/ci/gcp-token.sh > /tmp/gcp-token
    - docker login -u oauth2accesstoken --password-stdin "${GCP_REGION}-docker.pkg.dev" < /tmp/gcp-token
    - VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - docker build --build-arg VERSION="$VERSION" -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$IMAGE_NAME:${CI_COMMIT_TAG#v}"; fi
    - docker push --all-tags "$IMAGE_NAME"

deploy:
  extends: .gcp
  stage: deploy
  needs: [build:image]
  image: $GCLOUD_IMAGE
  environment:
    name: production
  interruptible: false # never cancel a rollout half-way
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl >/dev/null)
    - scripts/ci/gcp-token.sh > /tmp/gcp-token
    - export CLOUDSDK_AUTH_ACCESS_TOKEN_FILE=/tmp/gcp-token CLOUDSDK_CORE_PROJECT="$GCP_PROJECT_ID"
    - scripts/rollout.sh "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$GCP_REGION"
